<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgDS01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="600" height="400" fill="url(#bgDS01)"/>

  <!-- chapter badge -->
  <rect x="20" y="20" width="160" height="32" rx="16" fill="#7e22ce"/>
  <text x="100" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">មេរៀន 1.1</text>

  <!-- Venn diagram: 3 overlapping circles -->
  <!-- Circle 1: Math & Stats (top, pink) -->
  <circle cx="300" cy="160" r="90" fill="#f9a8d4" fill-opacity="0.55" stroke="#be185d" stroke-width="2"/>
  <text x="300" y="105" font-size="13" font-weight="700" fill="#831843" text-anchor="middle">គណិត · ស្ថិតិ</text>
  <text x="300" y="120" font-size="10" font-weight="500" fill="#831843" text-anchor="middle">Math &amp; Stats</text>

  <!-- Circle 2: Computer Science (bottom-left, blue) -->
  <circle cx="245" cy="245" r="90" fill="#93c5fd" fill-opacity="0.55" stroke="#1e40af" stroke-width="2"/>
  <text x="190" y="305" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">កុំព្យូទ័រ</text>
  <text x="190" y="320" font-size="10" font-weight="500" fill="#1e3a8a" text-anchor="middle">CS / Coding</text>

  <!-- Circle 3: Domain Knowledge (bottom-right, green) -->
  <circle cx="355" cy="245" r="90" fill="#86efac" fill-opacity="0.55" stroke="#166534" stroke-width="2"/>
  <text x="410" y="305" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">ចំណេះអាជីវកម្ម</text>
  <text x="410" y="320" font-size="10" font-weight="500" fill="#14532d" text-anchor="middle">Domain Knowledge</text>

  <!-- Center: Data Science -->
  <text x="300" y="218" font-size="16" font-weight="800" fill="#581c87" text-anchor="middle">Data</text>
  <text x="300" y="238" font-size="16" font-weight="800" fill="#581c87" text-anchor="middle">Science</text>

  <!-- Khmer subtitle -->
  <text x="300" y="375" font-size="18" font-weight="600" fill="#1f2937" text-anchor="middle">តើ Data Science ជាអ្វី?</text>
</svg>
