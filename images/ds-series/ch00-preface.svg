<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgDS00" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="600" height="400" fill="url(#bgDS00)"/>

  <!-- chapter badge -->
  <rect x="20" y="20" width="140" height="32" rx="16" fill="#7e22ce"/>
  <text x="90" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ផ្នែកទី 0</text>

  <!-- bar chart -->
  <g transform="translate(60, 90)">
    <line x1="0" y1="0" x2="0" y2="200" stroke="#6b21a8" stroke-width="2"/>
    <line x1="0" y1="200" x2="240" y2="200" stroke="#6b21a8" stroke-width="2"/>
    <rect x="20"  y="120" width="32" height="80"  fill="url(#barGrad)" rx="4"/>
    <rect x="68"  y="80"  width="32" height="120" fill="url(#barGrad)" rx="4"/>
    <rect x="116" y="40"  width="32" height="160" fill="url(#barGrad)" rx="4"/>
    <rect x="164" y="60"  width="32" height="140" fill="url(#barGrad)" rx="4"/>
    <rect x="212" y="20"  width="28" height="180" fill="url(#barGrad)" rx="4"/>
  </g>

  <!-- scatter overlay with trend line -->
  <g transform="translate(330, 100)">
    <line x1="0" y1="170" x2="220" y2="20" stroke="#a21caf" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="15"  cy="160" r="6" fill="#7e22ce"/>
    <circle cx="50"  cy="130" r="6" fill="#7e22ce"/>
    <circle cx="85"  cy="115" r="6" fill="#7e22ce"/>
    <circle cx="120" cy="80"  r="6" fill="#7e22ce"/>
    <circle cx="155" cy="60"  r="6" fill="#7e22ce"/>
    <circle cx="190" cy="35"  r="6" fill="#7e22ce"/>
  </g>

  <!-- DS monogram -->
  <circle cx="500" cy="80" r="36" fill="#7e22ce"/>
  <text x="500" y="92" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle">DS</text>

  <!-- Khmer subtitle -->
  <text x="300" y="370" font-size="20" font-weight="600" fill="#1f2937" text-anchor="middle">វិទ្យាសាស្ត្រទិន្នន័យ · Data Science</text>
</svg>
