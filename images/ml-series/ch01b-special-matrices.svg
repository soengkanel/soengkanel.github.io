<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg1b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <marker id="arrow1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e40af"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="url(#bg1b)"/>

  <!-- Left matrix A (4x4 with diagonal highlighted) -->
  <g transform="translate(70, 110)">
    <text x="100" y="-15" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">A</text>
    <rect x="0" y="0" width="200" height="200" rx="8" fill="#ffffff" stroke="#1e40af" stroke-width="2.5"/>
    <!-- diagonal highlight -->
    <g fill="#1e40af" opacity="0.18">
      <rect x="0" y="0" width="50" height="50"/>
      <rect x="50" y="50" width="50" height="50"/>
      <rect x="100" y="100" width="50" height="50"/>
      <rect x="150" y="150" width="50" height="50"/>
    </g>
    <g stroke="#94a3b8" stroke-width="0.8">
      <line x1="0" y1="50" x2="200" y2="50"/>
      <line x1="0" y1="100" x2="200" y2="100"/>
      <line x1="0" y1="150" x2="200" y2="150"/>
      <line x1="50" y1="0" x2="50" y2="200"/>
      <line x1="100" y1="0" x2="100" y2="200"/>
      <line x1="150" y1="0" x2="150" y2="200"/>
    </g>
    <g font-size="20" font-weight="800" fill="#1e3a8a" text-anchor="middle">
      <text x="25" y="34">a</text>
      <text x="75" y="84">b</text>
      <text x="125" y="134">c</text>
      <text x="175" y="184">d</text>
    </g>
  </g>

  <!-- Arrow with inverse symbol -->
  <line x1="290" y1="210" x2="345" y2="210" stroke="#1e40af" stroke-width="3" marker-end="url(#arrow1b)"/>
  <text x="318" y="195" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle">A⁻¹</text>

  <!-- Right matrix A inverse with diagonal inverted -->
  <g transform="translate(370, 110)">
    <text x="100" y="-15" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">A⁻¹</text>
    <rect x="0" y="0" width="200" height="200" rx="8" fill="#ffffff" stroke="#1e40af" stroke-width="2.5"/>
    <g fill="#dc2626" opacity="0.18">
      <rect x="0" y="0" width="50" height="50"/>
      <rect x="50" y="50" width="50" height="50"/>
      <rect x="100" y="100" width="50" height="50"/>
      <rect x="150" y="150" width="50" height="50"/>
    </g>
    <g stroke="#94a3b8" stroke-width="0.8">
      <line x1="0" y1="50" x2="200" y2="50"/>
      <line x1="0" y1="100" x2="200" y2="100"/>
      <line x1="0" y1="150" x2="200" y2="150"/>
      <line x1="50" y1="0" x2="50" y2="200"/>
      <line x1="100" y1="0" x2="100" y2="200"/>
      <line x1="150" y1="0" x2="150" y2="200"/>
    </g>
    <g font-size="18" font-weight="800" fill="#991b1b" text-anchor="middle">
      <text x="25" y="33">1/a</text>
      <text x="75" y="83">1/b</text>
      <text x="125" y="133">1/c</text>
      <text x="175" y="183">1/d</text>
    </g>
  </g>

  <!-- Chapter badge -->
  <rect x="20" y="20" width="130" height="32" rx="16" fill="#1e40af"/>
  <text x="85" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ជំពូក 1b</text>

  <!-- det(A) ≠ 0 -->
  <text x="300" y="65" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">det(A) ≠ 0 → ច្រាសបាន</text>

  <!-- Title -->
  <text x="300" y="370" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">ម៉ាទ្រីសពិសេស · ការច្រាស · ឌីទែរមីណង់</text>
</svg>
