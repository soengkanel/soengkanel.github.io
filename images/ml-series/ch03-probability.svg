<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg03" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="bell03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg03)"/>

  <!-- Chapter badge -->
  <rect x="20" y="20" width="120" height="32" rx="16" fill="#7c3aed"/>
  <text x="80" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ជំពូក 3</text>

  <!-- Axes -->
  <line x1="60" y1="290" x2="540" y2="290" stroke="#475569" stroke-width="1.5"/>
  <line x1="60" y1="80" x2="60" y2="290" stroke="#475569" stroke-width="1.5"/>

  <!-- Gaussian bell curve, mean=300, std controls width -->
  <path d="M 80 290
           C 200 290, 220 175, 300 95
           C 380 175, 400 290, 520 290 Z"
        fill="url(#bell03)" stroke="#7c3aed" stroke-width="3"/>

  <!-- Mean line -->
  <line x1="300" y1="95" x2="300" y2="290" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="300" y="80" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">μ (mean)</text>

  <!-- Standard deviation marker -->
  <line x1="240" y1="290" x2="240" y2="298" stroke="#0f766e" stroke-width="2"/>
  <line x1="360" y1="290" x2="360" y2="298" stroke="#0f766e" stroke-width="2"/>
  <line x1="240" y1="220" x2="360" y2="220" stroke="#0f766e" stroke-width="2"/>
  <text x="300" y="215" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">2σ</text>

  <!-- Histogram bars (samples) below curve -->
  <g opacity="0.75">
    <rect x="105" y="280" width="20" height="10" fill="#1e40af"/>
    <rect x="140" y="270" width="20" height="20" fill="#1e40af"/>
    <rect x="175" y="245" width="20" height="45" fill="#1e40af"/>
    <rect x="210" y="210" width="20" height="80" fill="#1e40af"/>
    <rect x="245" y="160" width="20" height="130" fill="#1e40af"/>
    <rect x="280" y="120" width="20" height="170" fill="#1e40af"/>
    <rect x="315" y="135" width="20" height="155" fill="#1e40af"/>
    <rect x="350" y="180" width="20" height="110" fill="#1e40af"/>
    <rect x="385" y="225" width="20" height="65" fill="#1e40af"/>
    <rect x="420" y="255" width="20" height="35" fill="#1e40af"/>
    <rect x="455" y="275" width="20" height="15" fill="#1e40af"/>
  </g>

  <!-- Y axis label -->
  <text x="35" y="190" font-size="14" font-weight="700" fill="#475569" transform="rotate(-90 35 190)" text-anchor="middle">P(x)</text>

  <!-- X axis label -->
  <text x="300" y="312" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">x</text>

  <!-- Bayes formula in box -->
  <rect x="150" y="335" width="300" height="40" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="300" y="361" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">
    P(A | B) = P(B | A) · P(A) / P(B)
  </text>

  <!-- Footer title -->
  <text x="300" y="392" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">ប្រូបាប៊ីលីតេ · Bayes · ការ​ចែក​ចាយ</text>
</svg>
