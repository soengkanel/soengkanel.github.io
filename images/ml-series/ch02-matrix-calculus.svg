<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg02" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <marker id="arrow02-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow02-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="url(#bg02)"/>

  <!-- Coordinate axes -->
  <line x1="60" y1="320" x2="540" y2="320" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="300" y1="80" x2="300" y2="360" stroke="#9ca3af" stroke-width="1.2"/>

  <!-- Parabola: y = (x-300)^2 / 80 + 100  scaled to fit -->
  <path d="M 100 280 Q 200 -80 300 320 Q 400 -80 500 280" fill="none" stroke="#1e40af" stroke-width="3.5"/>

  <!-- Better: simple parabola opening up, vertex near (300, 280) -->
  <path d="M 100 130 Q 300 460 500 130" fill="none" stroke="#1e40af" stroke-width="4"/>

  <!-- Tangent line at right side of parabola -->
  <line x1="320" y1="100" x2="510" y2="280" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Point on curve where tangent touches -->
  <circle cx="430" cy="190" r="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>

  <!-- Slope triangle (rise / run) -->
  <line x1="430" y1="190" x2="490" y2="190" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="490" y1="190" x2="490" y2="247" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="455" y="183" font-size="14" font-weight="700" fill="#dc2626">Δx</text>
  <text x="497" y="225" font-size="14" font-weight="700" fill="#dc2626">Δy</text>

  <!-- Gradient arrow from minimum upward in steepest direction (visual hint) -->
  <line x1="300" y1="320" x2="380" y2="240" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow02-grad)"/>
  <text x="340" y="288" font-size="18" font-weight="800" fill="#7c3aed">∇f</text>

  <!-- f(x) label -->
  <text x="120" y="120" font-size="22" font-weight="800" fill="#1e40af">f(x)</text>

  <!-- Slope label -->
  <text x="420" y="130" font-size="18" font-weight="800" fill="#dc2626">f'(x) = slope</text>

  <!-- Chapter badge -->
  <rect x="20" y="20" width="120" height="32" rx="16" fill="#1e40af"/>
  <text x="80" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ជំពូក 2</text>

  <!-- Title -->
  <text x="300" y="385" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">កាល់គុលម៉ាទ្រីស · និស្សន្ទ និងក្រាដ្យង់</text>
</svg>
