<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg10)"/>

  <!-- Chapter badge -->
  <rect x="20" y="20" width="120" height="32" rx="16" fill="#10b981"/>
  <text x="80" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ជំពូក 10</text>

  <!-- Axes -->
  <line x1="70" y1="320" x2="540" y2="320" stroke="#475569" stroke-width="1.5"/>
  <line x1="70" y1="80" x2="70" y2="320" stroke="#475569" stroke-width="1.5"/>

  <!-- Cluster 1 (blue) -->
  <g fill="#1e40af">
    <circle cx="125" cy="265" r="7"/>
    <circle cx="155" cy="245" r="7"/>
    <circle cx="140" cy="285" r="7"/>
    <circle cx="180" cy="270" r="7"/>
    <circle cx="115" cy="240" r="7"/>
    <circle cx="170" cy="225" r="7"/>
    <circle cx="155" cy="295" r="7"/>
  </g>

  <!-- Cluster 2 (red) -->
  <g fill="#dc2626">
    <circle cx="290" cy="140" r="7"/>
    <circle cx="320" cy="155" r="7"/>
    <circle cx="310" cy="120" r="7"/>
    <circle cx="345" cy="135" r="7"/>
    <circle cx="295" cy="170" r="7"/>
    <circle cx="335" cy="170" r="7"/>
    <circle cx="280" cy="125" r="7"/>
  </g>

  <!-- Cluster 3 (green) -->
  <g fill="#10b981">
    <circle cx="430" cy="260" r="7"/>
    <circle cx="465" cy="245" r="7"/>
    <circle cx="450" cy="285" r="7"/>
    <circle cx="490" cy="270" r="7"/>
    <circle cx="420" cy="235" r="7"/>
    <circle cx="475" cy="220" r="7"/>
    <circle cx="465" cy="295" r="7"/>
  </g>

  <!-- Centroids -->
  <g stroke="#1f2937" stroke-width="3">
    <line x1="138" y1="255" x2="158" y2="275"/>
    <line x1="158" y1="255" x2="138" y2="275"/>
    <line x1="305" y1="140" x2="325" y2="160"/>
    <line x1="325" y1="140" x2="305" y2="160"/>
    <line x1="450" y1="250" x2="470" y2="270"/>
    <line x1="470" y1="250" x2="450" y2="270"/>
  </g>

  <!-- Voronoi-ish dashed boundaries -->
  <g stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" opacity="0.55" fill="none">
    <line x1="225" y1="320" x2="225" y2="80"/>
    <line x1="385" y1="320" x2="385" y2="80"/>
  </g>

  <!-- Axis labels -->
  <text x="305" y="345" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">x₁</text>
  <text x="45" y="200" font-size="14" font-weight="700" fill="#475569" transform="rotate(-90 45 200)" text-anchor="middle">x₂</text>

  <!-- Equation box -->
  <rect x="370" y="80" width="170" height="60" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="455" y="105" font-size="14" font-weight="800" fill="#10b981" text-anchor="middle">argmin Σ‖x − μₖ‖²</text>
  <text x="455" y="128" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Lloyd's · k-means++</text>

  <!-- Footer -->
  <text x="300" y="380" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">K-Means · centroids · WCSS · elbow · Voronoi</text>
</svg>
