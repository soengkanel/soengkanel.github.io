<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgmd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <marker id="arrowmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="url(#bgmd)"/>

  <!-- Category badge -->
  <rect x="20" y="20" width="100" height="32" rx="16" fill="#059669"/>
  <text x="70" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Math</text>

  <!-- Speedometer outer arc -->
  <path d="M 130 290 A 130 130 0 0 1 390 290" fill="none" stroke="#1e40af" stroke-width="6"/>
  <!-- Tick marks on speedometer -->
  <line x1="130" y1="290" x2="142" y2="278" stroke="#1e40af" stroke-width="3"/>
  <line x1="166" y1="216" x2="179" y2="222" stroke="#1e40af" stroke-width="3"/>
  <line x1="260" y1="160" x2="260" y2="174" stroke="#1e40af" stroke-width="3"/>
  <line x1="354" y1="216" x2="341" y2="222" stroke="#1e40af" stroke-width="3"/>
  <line x1="390" y1="290" x2="378" y2="278" stroke="#1e40af" stroke-width="3"/>

  <!-- Speed labels -->
  <text x="130" y="312" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">0</text>
  <text x="260" y="152" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">60</text>
  <text x="390" y="312" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">120</text>

  <!-- Needle pointing to right side (high speed) -->
  <line x1="260" y1="290" x2="345" y2="208" stroke="#dc2626" stroke-width="5" marker-end="url(#arrowmd)" stroke-linecap="round"/>
  <circle cx="260" cy="290" r="8" fill="#1f2937"/>

  <!-- Center label -->
  <text x="260" y="270" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">km/h</text>

  <!-- Right side: small graph of position vs time -->
  <g transform="translate(440, 110)">
    <rect x="0" y="0" width="140" height="120" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="14" y1="106" x2="130" y2="106" stroke="#6b7280" stroke-width="1"/>
    <line x1="14" y1="14" x2="14" y2="106" stroke="#6b7280" stroke-width="1"/>
    <!-- Curve s(t) -->
    <path d="M 14 100 Q 60 90 90 50 T 130 18" fill="none" stroke="#1e40af" stroke-width="2.5"/>
    <!-- Tangent line -->
    <line x1="68" y1="84" x2="118" y2="38" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
    <circle cx="90" cy="62" r="4" fill="#dc2626"/>
    <text x="70" y="124" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">s(t) position</text>
  </g>

  <text x="510" y="252" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">slope = ds/dt</text>
  <text x="510" y="270" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">= ល្បឿន (speed)</text>

  <!-- Footer title -->
  <text x="300" y="358" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">និស្សន្ទ​ក្នុង​ជីវិត​ប្រចាំ​ថ្ងៃ</text>
  <text x="300" y="380" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">ល្បឿន · តម្លៃ · ការ​បំពេញ​ទឹក · ការ​បង្កើន​ប្រសិទ្ធភាព</text>
</svg>
