<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg08" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg08)"/>

  <!-- Chapter badge -->
  <rect x="20" y="20" width="120" height="32" rx="16" fill="#7c3aed"/>
  <text x="80" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ជំពូក 8</text>

  <!-- Axes -->
  <line x1="70" y1="320" x2="540" y2="320" stroke="#475569" stroke-width="1.5"/>
  <line x1="70" y1="80" x2="70" y2="320" stroke="#475569" stroke-width="1.5"/>

  <!-- Data points (noisy sine) -->
  <g fill="#1e40af">
    <circle cx="100" cy="240" r="6"/>
    <circle cx="140" cy="170" r="6"/>
    <circle cx="180" cy="130" r="6"/>
    <circle cx="220" cy="155" r="6"/>
    <circle cx="260" cy="210" r="6"/>
    <circle cx="300" cy="260" r="6"/>
    <circle cx="340" cy="240" r="6"/>
    <circle cx="380" cy="195" r="6"/>
    <circle cx="420" cy="160" r="6"/>
    <circle cx="460" cy="195" r="6"/>
    <circle cx="500" cy="245" r="6"/>
  </g>

  <!-- True function (smooth) -->
  <path d="M 80 230 Q 180 110 280 240 Q 380 180 500 230"
        stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>

  <!-- Overfit (wiggly red) -->
  <path d="M 80 250 Q 110 200 130 180 Q 150 130 175 130 Q 200 120 215 165
           Q 235 220 265 215 Q 290 270 320 250 Q 345 230 365 200
           Q 380 175 410 170 Q 440 165 460 195 Q 485 225 510 250"
        stroke="#dc2626" stroke-width="2.5" fill="none"/>

  <!-- Regularized (purple smooth) -->
  <path d="M 80 235 Q 180 140 290 230 Q 390 195 510 230"
        stroke="#7c3aed" stroke-width="3.5" fill="none"/>

  <!-- Axis labels -->
  <text x="305" y="345" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">x</text>
  <text x="45" y="200" font-size="14" font-weight="700" fill="#475569" transform="rotate(-90 45 200)" text-anchor="middle">y</text>

  <!-- Legend -->
  <g font-size="12" font-weight="600">
    <line x1="160" y1="60" x2="190" y2="60" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="195" y="64" fill="#475569">true</text>

    <line x1="260" y1="60" x2="290" y2="60" stroke="#dc2626" stroke-width="2.5"/>
    <text x="295" y="64" fill="#dc2626">overfit</text>

    <line x1="380" y1="60" x2="410" y2="60" stroke="#7c3aed" stroke-width="3.5"/>
    <text x="415" y="64" fill="#7c3aed">regularized</text>
  </g>

  <!-- Equation box -->
  <rect x="370" y="245" width="170" height="60" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="455" y="270" font-size="16" font-weight="800" fill="#7c3aed" text-anchor="middle">L + λ‖w‖²</text>
  <text x="455" y="294" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Ridge · Lasso · CV</text>

  <!-- Footer title -->
  <text x="300" y="380" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Overfitting · Bias–Variance · Regularization · Cross-Validation</text>
</svg>
