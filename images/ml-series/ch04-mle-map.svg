<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg04" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="like04" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="post04" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg04)"/>

  <!-- Chapter badge -->
  <rect x="20" y="20" width="120" height="32" rx="16" fill="#be185d"/>
  <text x="80" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ជំពូក 4</text>

  <!-- Axes -->
  <line x1="60" y1="290" x2="540" y2="290" stroke="#475569" stroke-width="1.5"/>
  <line x1="60" y1="80" x2="60" y2="290" stroke="#475569" stroke-width="1.5"/>

  <!-- Likelihood curve (blue, peak at right, MLE) -->
  <path d="M 80 290
           C 200 290, 280 275, 360 130
           C 400 165, 460 260, 520 290 Z"
        fill="url(#like04)" stroke="#1e40af" stroke-width="3"/>

  <!-- Posterior curve (red, peak shifted left by prior, MAP) -->
  <path d="M 80 290
           C 180 290, 240 240, 300 110
           C 360 180, 440 270, 520 290 Z"
        fill="url(#post04)" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- MLE peak marker -->
  <circle cx="360" cy="130" r="7" fill="#1e40af" stroke="#0f172a" stroke-width="2"/>
  <text x="360" y="115" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">MLE</text>

  <!-- MAP peak marker -->
  <circle cx="300" cy="110" r="7" fill="#dc2626" stroke="#0f172a" stroke-width="2"/>
  <text x="300" y="95" font-size="13" font-weight="800" fill="#dc2626" text-anchor="middle">MAP</text>

  <!-- Legend -->
  <rect x="395" y="90" width="135" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="405" y1="106" x2="430" y2="106" stroke="#1e40af" stroke-width="3"/>
  <text x="437" y="111" font-size="12" font-weight="600" fill="#1e40af">likelihood</text>
  <line x1="405" y1="128" x2="430" y2="128" stroke="#dc2626" stroke-width="3" stroke-dasharray="4,3"/>
  <text x="437" y="133" font-size="12" font-weight="600" fill="#dc2626">posterior</text>

  <!-- Y axis label -->
  <text x="35" y="190" font-size="14" font-weight="700" fill="#475569" transform="rotate(-90 35 190)" text-anchor="middle">density</text>

  <!-- X axis label -->
  <text x="300" y="312" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">θ (parameter)</text>

  <!-- Formula box -->
  <rect x="100" y="335" width="400" height="40" rx="10" fill="#ffffff" stroke="#be185d" stroke-width="2"/>
  <text x="300" y="361" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">
    θ_MAP = argmax P(D | θ) · P(θ)   vs   θ_MLE = argmax P(D | θ)
  </text>

  <!-- Footer title -->
  <text x="300" y="392" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">MLE · MAP · ការ​ប៉ាន់​ប្រមាណ​ប៉ារ៉ាម៉ែត្រ</text>
</svg>
