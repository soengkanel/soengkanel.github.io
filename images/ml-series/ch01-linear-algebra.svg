<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <marker id="arrow01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow01b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e40af"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="url(#bg01)"/>

  <!-- Coordinate axes -->
  <line x1="60" y1="300" x2="340" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="80" y2="320" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Grid -->
  <g stroke="#cbd5e1" stroke-width="0.5">
    <line x1="80" y1="240" x2="340" y2="240"/>
    <line x1="80" y1="180" x2="340" y2="180"/>
    <line x1="80" y1="120" x2="340" y2="120"/>
    <line x1="140" y1="80" x2="140" y2="320"/>
    <line x1="200" y1="80" x2="200" y2="320"/>
    <line x1="260" y1="80" x2="260" y2="320"/>
  </g>

  <!-- Vector a -->
  <line x1="80" y1="300" x2="260" y2="120" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrow01)"/>
  <text x="200" y="190" font-size="20" font-weight="700" fill="#dc2626">a</text>

  <!-- Vector b -->
  <line x1="80" y1="300" x2="290" y2="225" stroke="#1e40af" stroke-width="3.5" marker-end="url(#arrow01b)"/>
  <text x="240" y="280" font-size="20" font-weight="700" fill="#1e40af">b</text>

  <!-- Matrix grid -->
  <g transform="translate(395, 130)">
    <text x="65" y="-15" font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">matrix X</text>
    <rect x="0" y="0" width="160" height="120" rx="6" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
    <g stroke="#1e40af" stroke-width="1">
      <line x1="0" y1="30" x2="160" y2="30"/>
      <line x1="0" y1="60" x2="160" y2="60"/>
      <line x1="0" y1="90" x2="160" y2="90"/>
      <line x1="40" y1="0" x2="40" y2="120"/>
      <line x1="80" y1="0" x2="80" y2="120"/>
      <line x1="120" y1="0" x2="120" y2="120"/>
    </g>
    <g font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">
      <text x="20" y="22">45</text><text x="60" y="22">2.5</text><text x="100" y="22">1.2</text><text x="140" y="22">6</text>
      <text x="20" y="52">32</text><text x="60" y="52">1.0</text><text x="100" y="52">0.8</text><text x="140" y="52">4</text>
      <text x="20" y="82">58</text><text x="60" y="82">4.0</text><text x="100" y="82">1.5</text><text x="140" y="82">8</text>
      <text x="20" y="112">28</text><text x="60" y="112">0.5</text><text x="100" y="112">0.6</text><text x="140" y="112">3</text>
    </g>
  </g>

  <!-- Chapter badge -->
  <rect x="20" y="20" width="120" height="32" rx="16" fill="#1e40af"/>
  <text x="80" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ជំពូក 1</text>

  <!-- Title -->
  <text x="300" y="370" font-size="18" font-weight="600" fill="#1f2937" text-anchor="middle">ពិជគណិតលីនេអ៊ែរ · Linear Algebra</text>
</svg>
