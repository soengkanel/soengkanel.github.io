<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg11)"/>

  <!-- Chapter badge -->
  <rect x="20" y="20" width="120" height="32" rx="16" fill="#0d9488"/>
  <text x="80" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ជំពូក 11</text>

  <!-- Bayes formula center -->
  <rect x="150" y="80" width="320" height="100" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  <text x="310" y="120" font-size="22" font-weight="800" fill="#0d9488" text-anchor="middle">P(y | x) ∝ P(y) · ∏ P(xⱼ | y)</text>
  <text x="310" y="150" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">prior × naive product of likelihoods</text>
  <text x="310" y="170" font-size="11" fill="#94a3b8" text-anchor="middle">"feature ឯករាជ្យ ឱ្យ class"</text>

  <!-- Document on left → arrow → class on right -->
  <g>
    <rect x="50" y="240" width="130" height="120" rx="10" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
    <text x="115" y="265" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">ឈ្នះ រង្វាន់</text>
    <text x="115" y="285" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">free ចុច link</text>
    <text x="115" y="305" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">បន្ទាន់ OTP</text>
    <text x="115" y="345" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">SMS / text</text>
  </g>

  <!-- Arrow -->
  <g stroke="#7c3aed" stroke-width="3" fill="none">
    <line x1="195" y1="300" x2="395" y2="300"/>
    <polygon points="395,300 380,290 380,310" fill="#7c3aed"/>
  </g>
  <text x="295" y="290" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">argmax P(y|x)</text>

  <!-- Spam / Ham boxes -->
  <g>
    <rect x="410" y="240" width="140" height="50" rx="10" fill="#dc2626"/>
    <text x="480" y="272" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">🚫 SPAM</text>

    <rect x="410" y="310" width="140" height="50" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="480" y="342" font-size="16" font-weight="700" fill="#10b981" text-anchor="middle">✅ HAM</text>
  </g>

  <!-- Footer -->
  <text x="300" y="390" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Naive Bayes · Gaussian · Multinomial · Bernoulli · Laplace smoothing</text>
</svg>
