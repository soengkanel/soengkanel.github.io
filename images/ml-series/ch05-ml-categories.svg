<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg05" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg05)"/>

  <!-- Chapter badge -->
  <rect x="20" y="20" width="120" height="32" rx="16" fill="#0f766e"/>
  <text x="80" y="42" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">ជំពូក 5</text>

  <!-- Quadrant grid lines -->
  <line x1="300" y1="65" x2="300" y2="355" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="40"  y1="210" x2="560" y2="210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Quadrant 1: Supervised (top-left) -->
  <text x="170" y="85" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">Supervised</text>
  <circle cx="100" cy="160" r="9" fill="#1e40af"/>
  <text x="100" y="142" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">y=1</text>
  <circle cx="155" cy="180" r="9" fill="#1e40af"/>
  <circle cx="125" cy="190" r="9" fill="#1e40af"/>
  <circle cx="200" cy="135" r="9" fill="#dc2626"/>
  <text x="200" y="125" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">y=0</text>
  <circle cx="245" cy="170" r="9" fill="#dc2626"/>
  <circle cx="220" cy="185" r="9" fill="#dc2626"/>
  <line x1="80" y1="200" x2="270" y2="120" stroke="#0f172a" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Quadrant 2: Unsupervised (top-right) -->
  <text x="430" y="85" font-size="13" font-weight="800" fill="#7c3aed" text-anchor="middle">Unsupervised</text>
  <g fill="#7c3aed">
    <circle cx="360" cy="135" r="8"/>
    <circle cx="380" cy="155" r="8"/>
    <circle cx="370" cy="175" r="8"/>
  </g>
  <circle cx="372" cy="155" r="35" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,3"/>
  <g fill="#0f766e">
    <circle cx="475" cy="145" r="8"/>
    <circle cx="495" cy="170" r="8"/>
    <circle cx="510" cy="140" r="8"/>
    <circle cx="480" cy="180" r="8"/>
  </g>
  <circle cx="490" cy="160" r="35" fill="none" stroke="#0f766e" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Quadrant 3: Reinforcement (bottom-left) -->
  <text x="170" y="230" font-size="13" font-weight="800" fill="#dc2626" text-anchor="middle">Reinforcement</text>
  <rect x="80" y="250" width="50" height="40" rx="6" fill="#fef3c7" stroke="#dc2626" stroke-width="2"/>
  <text x="105" y="275" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">agent</text>
  <path d="M 135 270 L 175 270" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="155" y="262" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">action</text>
  <rect x="180" y="250" width="60" height="40" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="210" y="275" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">env</text>
  <path d="M 235 295 Q 170 320 105 295" stroke="#0f172a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="170" y="335" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">reward + state</text>

  <!-- Quadrant 4: Semi/Self-supervised (bottom-right) -->
  <text x="430" y="230" font-size="13" font-weight="800" fill="#ea580c" text-anchor="middle">Semi-supervised</text>
  <g>
    <circle cx="360" cy="270" r="9" fill="#1e40af"/>
    <circle cx="395" cy="285" r="9" fill="#1e40af"/>
    <circle cx="430" cy="265" r="9" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="455" cy="290" r="9" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="490" cy="270" r="9" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="510" cy="295" r="9" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="370" cy="305" r="9" fill="#dc2626"/>
  </g>
  <text x="430" y="335" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">labeled + unlabeled</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Footer title -->
  <text x="300" y="380" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">ប្រភេទ​នៃ Machine Learning</text>
</svg>
